[workspace]
members = [
    "apps/pit-node",
    "crates/pit-runtime",
    "crates/pit-scheduler",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
pit-artifact = { path = "../pit-crew/crates/pit-artifact" }
pit-lane-core = { path = "../pit-lane/crates/pit-lane-core" }
sha2 = "0.10"
tokio = { version = "1.53", features = ["io-util"] }
bytes = "1.10"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["full"] }
tracing = "0.1"
wat = "1.0"
wasmtime = "39.0"
wasmtime-wasi = "39.0"
wasmtime-wasi-http = { version = "39.0", default-features = false }
wasmparser = "0.240"

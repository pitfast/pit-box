[workspace]
members = [
    "apps/pit-node",
    "apps/pit-garage",
    "crates/pit-runtime",
    "crates/pit-scheduler",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
pit-artifact = { path = "../pit-crew/crates/pit-artifact" }
pit-circuit-core = { path = "../pit-circuit/crates/pit-circuit-core" }
pit-deployment = { path = "../pit-lane/crates/pit-deployment" }
pit-lane-core = { path = "../pit-lane/crates/pit-lane-core" }
pit-paddock-core = { path = "../pit-paddock/crates/pit-paddock-core" }
pit-paddock-factory = { path = "../pit-paddock/crates/pit-paddock-factory" }
pit-paddock-fs = { path = "../pit-paddock/crates/pit-paddock-fs" }
sha2 = "0.10"
tokio = { version = "1.53", features = ["io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
bytes = "1.10"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wat = "1.0"
wasmtime = "39.0"
wasmtime-wasi = "39.0"
wasmtime-wasi-http = { version = "39.0", default-features = false }
wasmparser = "0.240"

[workspace]
members = [
    "apps/pit",
    "apps/pit-node",
    "crates/pit-runtime",
    "crates/pit-scheduler",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.53", features = ["io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wat = "1.0"
wasmtime = "39.0"
wasmtime-wasi = "39.0"
